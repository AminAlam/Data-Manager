<!DOCTYPE html>
<html>
<head>
  <title>Data Manager - Google Drive Integration</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      width: 350px;
      padding: 10px;
    }
    .hidden {
      display: none;
    }
    .success-message {
      color: green;
      font-weight: bold;
    }
    .error-message {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h4 class="mb-3">Data Manager</h4>
    
    <!-- Configuration Form -->
    <div id="configForm">
      <h5>Configuration</h5>
      <form id="apiConfigForm">
        <div class="mb-3">
          <label for="serverUrl" class="form-label">Server URL</label>
          <input type="url" class="form-control" id="serverUrl" placeholder="https://your-data-manager-url.com" required>
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
          <label for="apiKey" class="form-label">API Key</label>
          <input type="password" class="form-control" id="apiKey" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Configuration</button>
      </form>
      <hr>
      <button id="toggleAddEntry" class="btn btn-outline-secondary w-100 mt-2 hidden">Switch to Add Entry</button>
    </div>
    
    <!-- Add Entry Form -->
    <div id="addEntryForm" class="hidden">
      <h5>Add Entry</h5>
      <div id="documentInfo" class="alert alert-info mb-3">
        <p class="mb-1"><strong>Document:</strong> <span id="docTitle">Not detected</span></p>
        <p class="mb-1"><strong>Type:</strong> <span id="docType">Unknown</span></p>
        <p class="mb-0"><strong>URL:</strong> <span id="docUrl">Not available</span></p>
      </div>
      
      <form id="entryForm">
        <div class="mb-3">
          <label for="entryName" class="form-label">Entry Name</label>
          <input type="text" class="form-control" id="entryName" required>
        </div>
        <div class="mb-3">
          <label for="tags" class="form-label">Tags (comma separated)</label>
          <input type="text" class="form-control" id="tags" placeholder="tag1, tag2, tag3">
        </div>
        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea class="form-control" id="notes" rows="3"></textarea>
        </div>
        
        <div id="messageBox" class="mb-3 hidden"></div>
        <div class="d-grid gap-2">
          <button type="submit" id="submitButton" class="btn btn-success">Add to Data Manager</button>
          <button type="button" id="toggleConfig" class="btn btn-outline-secondary">Switch to Configuration</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
